spring.application.name=lumia
server.port=${PORT:8080}

spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.url=${DB_URL:jdbc:mysql://lumia-db-lumia.h.aivencloud.com:21541/defaultdb?sslmode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.sql.init.mode=${SQL_INIT_MODE:always}
# application.properties
jwt.secret.key=YourVeryLongAndSecureSecretKeyForLumiaAppReplaceThisWithARandomStringOfSufficientLengthForHS256AlgorithmLike64CharsOrMore

# Access Token ?? ?? (?: 1?? = 3600000 ms)
jwt.access.token.validity.ms=3600000

# Refresh Token ?? ?? (30?)
jwt.refresh.token.validity.ms=2592000000
# (30? = 30 * 24?? * 60? * 60? * 1000??? = 2,592,000,000)
logging.level.org.springframework.security=DEBUG

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.4-mini}
openai.timeout-millis=${OPENAI_TIMEOUT_MILLIS:15000}

content-filter.enabled=${CONTENT_FILTER_ENABLED:false}
content-filter.url=${CONTENT_FILTER_URL:http://3.39.239.196:8000/filter_post}
